name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Syntax check all PHP files
        run: |
          ERR=0
          for f in $(find . -name "*.php" -not -path "./vendor/*" -not -path "./node_modules/*"); do
            php -l "$f" > /dev/null 2>&1 || { echo "SYNTAX ERROR: $f"; ERR=1; }
          done
          exit $ERR

      - name: Run test harness
        run: php -f tests/test-harness.php

  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install coding standards
        run: composer install --no-interaction --no-progress

      - name: PHPCS (WordPress standards)
        run: composer lint